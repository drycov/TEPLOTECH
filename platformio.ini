[platformio]
default_envs = nano-lcd, nano-oled, esp32-lcd, esp32-oled
src_dir = src

[env]
framework = arduino
lib_deps =
  gyverlibs/GyverNTC
  marcoschwartz/LiquidCrystal_I2C@1.1.4
  olikraus/U8g2@2.36.18

[env:nano-lcd]
platform = atmelavr
board = nanoatmega328

[env:nano-oled]
platform = atmelavr
board = nanoatmega328
build_flags =
  -DTEPLOTECH_USE_OLED=1
  -DTEPLOTECH_OLED_I2C_ADDRESS=0x3C

[env:esp32-lcd]
platform = espressif32
board = esp32dev

[env:esp32-oled]
platform = espressif32
board = esp32dev
build_flags =
  -DTEPLOTECH_USE_OLED=1
  -DTEPLOTECH_OLED_I2C_ADDRESS=0x3C
